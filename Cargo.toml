[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean D. True <sean.true@gmail.com>"]
repository = "https://github.com/seantrue/yapocis-rs"

[workspace.dependencies]
opencl3 = "0.12.3"
objc2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
block2 = "0.6.2"
cudarc = { version = "0.19.10", default-features = false }
ndarray = "0.17.2"
ndarray-npy = { version = "0.10.0", features = ["npz", "num-complex-0_4"] }
bytemuck = "1"
num-complex = { version = "0.4", features = ["bytemuck"] }
half = { version = "2", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
dirs = "6"
approx = "0.5"
anyhow = "1"
