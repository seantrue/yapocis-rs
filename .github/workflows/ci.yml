name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only: no GPU on hosted runners, so build every backend (Metal is
  # macOS-only and is checked on the maintainer's machine), lint, and run the
  # device-free tests. GPU parity runs on the M4 MacBook and the Linux host.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # opencl3 links libOpenCL at build time (FreeType is built from source)
      # bounded: when a mirror's DNS fails, apt otherwise retries for ~25 minutes
      - name: Install OpenCL headers
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y ocl-icd-opencl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets --features yapocis/ocl,yapocis/cuda,yapocis/rustcpu
      - run: cargo clippy --workspace --all-targets --features yapocis/ocl,yapocis/cuda,yapocis/rustcpu -- -D warnings
      - run: cargo test -p yapocis-bundle
      - run: cargo test -p yapocis --lib
      - run: cargo doc -p yapocis --no-deps --features yapocis/ocl,yapocis/cuda,yapocis/rustcpu

  # The kernel and library tests on the CPU backend (Rust ports of the OpenCL
  # kernels), compared with the fixtures recorded on PoCL's CPU OpenCL device.
  # The only backend a hosted runner can run, so the only kernel parity in CI.
  rustcpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p yapocis --features rustcpu
      # The Python bindings (Yapocis3's rustcpu backend) live outside the
      # workspace; keep them compiling against yapocis-rt.
      - run: cargo clippy --manifest-path bindings/python/Cargo.toml -- -D warnings

  # The vendored bundle must match what the pinned Python package renders.
  bundle-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the Python package that generated the bundle
        run: |
          ref="$(sed -n 's/^ref: //p' crates/yapocis/bundle/SOURCE)"
          pip install "git+https://github.com/seantrue/Yapocis3@${ref}"
      - run: scripts/check-bundle.sh
