[package]
name = "npzfile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "numpy .npz archives for ndarray, as ndarray-npy's NpzReader and NpzWriter, on a current zip crate"
publish = false

[dependencies]
ndarray.workspace = true
ndarray-npy.workspace = true
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
